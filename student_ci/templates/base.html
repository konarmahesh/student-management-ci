<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Student Management{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header><a class="brand" href="{{ url_for('home') }}">S<span> / </span>Student Management</a>
    {% if session.get('user') %}
    <form method="post" action="{{ url_for('logout') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <span class="username">{{ session['user'] }}</span><button class="secondary">Sign out</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% for message in get_flashed_messages() %}<div class="notice" role="status">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
  <footer>Student Management System · DevOps mini project</footer>
</body>
</html>
