name: Student Management CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Get project code
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v --junitxml=test-results.xml

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check the installed wheel
        run: python scripts/check_wheel.py

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: warn

      - name: Save application build
        uses: actions/upload-artifact@v4
        with:
          name: student-management-build
          path: dist/*
          if-no-files-found: error
